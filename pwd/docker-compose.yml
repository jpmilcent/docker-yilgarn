services:

  pwd-clapas-passbolt:
    image: passbolt/passbolt:5.17.0-1-ce
    # https://hub.docker.com/r/passbolt/passbolt
    container_name: pwd-clapas-passbolt
    restart: always
    expose:
      - 443
    networks:
      - passbolt-net
      - nginx-proxy
    depends_on:
      - pwd-clapas-database
    env_file:
      - ./passbolt/.env
    environment:
      VIRTUAL_HOST: pwd.clapas.org
      LETSENCRYPT_HOST: pwd.clapas.org
      VIRTUAL_PROTO: https
      VIRTUAL_PORT: 443
    volumes:
      - gpg-storage:/etc/passbolt/gpg
      - jwt-storage:/etc/passbolt/jwt
      - images-storage:/usr/share/php/passbolt/webroot/img/public
    tty: true
    command: ["/docker-entrypoint.sh"]

  pwd-clapas-database:
    image: mariadb:11.8.9
    # https://hub.docker.com/_/mariadb
    container_name: pwd-clapas-database
    restart: unless-stopped
    networks:
      - passbolt-net
    expose:
      - 3306
    env_file:
      - ./mariadb/.env
    volumes:
      - database-storage:/var/lib/mysql

volumes:
  database-storage:
  gpg-storage:
  images-storage:
  jwt-storage:

networks:
  nginx-proxy:
    external: true
  passbolt-net:
