; Masquage des erreurs aux visiteurs et redirection vers les logs
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Tailles maximales de téléversement et mémoire
upload_max_filesize = 128M
post_max_size = 132M
memory_limit = 256M

; Envoi d'emails via msmtp
sendmail_path = /usr/bin/msmtp -t -C /etc/msmtprc
