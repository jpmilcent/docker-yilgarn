version: "3.9"

services:

  bookmarks-shaarli:
    # https://hub.docker.com/r/shaarli/shaarli
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     BACKUP_DATE: "2019-10-29"
    image: shaarli/shaarli:v0.12.1
    container_name: bookmarks.clapas.org_shaarli
    restart: unless-stopped
    expose:
      - 80
    environment:
      VIRTUAL_HOST: bookmarks.clapas.org
      LETSENCRYPT_HOST: bookmarks.clapas.org
    volumes:
      - cache-shaarli-storage:/var/www/shaarli/cache
      - data-shaarli-storage:/var/www/shaarli/data

volumes:
  cache-shaarli-storage:
  data-shaarli-storage:

networks:
  default:
    external:
      name: nginx-proxy
