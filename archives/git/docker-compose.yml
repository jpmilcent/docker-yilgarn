services:

  git-webserver:
    image: nginx:1.30.6
    # https://hub.docker.com/_/nginx
    container_name: git-webserver
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      - git-gogs
    environment:
      VIRTUAL_HOST: git.clapas.org
      LETSENCRYPT_HOST: git.clapas.org
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro

  git-gogs:
    image: gogs/gogs:0.11.91
    container_name: git-gogs
    restart: unless-stopped
    expose:
      - 3000
    ports:
      - "10022:22"
    volumes:
      - ./backup:/backup
      - gogs-storage:/data
      - ./gogs/app.ini:/data/gogs/conf/app.ini

volumes:
  gogs-storage:

networks:
  default:
    name: nginx-proxy
    external: true
