version: "3"

services:

  yilgarn-clapas-webserver:
    image: nginx:1.21.4
    container_name: yilgarn.clapas.ovh_webserver
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      - yilgarn-clapas-php
    environment:
      VIRTUAL_HOST: yilgarn.clapas.ovh
      LETSENCRYPT_HOST: yilgarn.clapas.ovh
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/var/www/html

  yilgarn-clapas-php:
    image: php:8.1.1-fpm-buster
    container_name: yilgarn.clapas.ovh_php-test
    restart: unless-stopped
    expose:
      - 9000
    volumes:
      - ./data:/var/www/html

networks:
  default:
    external:
      name: nginx-proxy
