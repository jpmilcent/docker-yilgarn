version: "3"

services:

  yilgarn-clapas-webserver:
    image: nginx:1.17.4
    container_name: yilgarn.clapas.ovh_webserver
    ports:
      - 8081:80
    depends_on:
      - yilgarn-clapas-php
    environment:
      VIRTUAL_HOST: yilgarn.clapas.ovh
      VIRTUAL_PORT: 8081
    volumes:
      - ./nginx-data/app.conf:/etc/nginx/conf.d/default.conf:ro
      - www-data:/var/www/html
      - ./www:/var/www/html/test

  yilgarn-clapas-php:
    image: php:7.3.10-fpm-buster
    container_name: yilgarn.clapas.ovh_php-test
    restart: unless-stopped
    expose:
      - 9000
    volumes:
      - www-data:/var/www/html
      - ./www:/var/www/html/test

volumes:
  www-data:

networks:
  default:
    external:
      name: nginx-proxy
