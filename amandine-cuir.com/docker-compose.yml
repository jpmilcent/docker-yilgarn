version: "3.9"

services:

  amandine-cuir-webserver:
    image: nginx:1.21.4
    # https://hub.docker.com/_/nginx
    container_name: amandine-cuir-webserver
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      - amandine-cuir-cms
    environment:
      VIRTUAL_HOST: amandine-cuir.com
      LETSENCRYPT_HOST: amandine-cuir.com
    volumes:
      - wordpress-storage:/var/www/html
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      #- ./test:/var/www/html/test

  amandine-cuir-cms:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKUP_DATE: "2021-12-29"
    image: wordpress:5.8.2-php7.4-fpm
    # https://hub.docker.com/_/wordpress
    container_name: amandine-cuir-cms
    restart: unless-stopped
    env_file: .env
    expose:
      - 9000
    depends_on:
      - amandine-cuir-database
    environment:
      WORDPRESS_DB_HOST: amandine-cuir-database:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: amandine_cuir
      WORDPRESS_TABLE_PREFIX: ac_
    volumes:
      - wordpress-storage:/var/www/html
      #- ./wp-content:/var/www/html/wp-content
      #- ./test:/var/www/html/test


  amandine-cuir-database:
    image: mariadb:10.7.1
    # https://hub.docker.com/_/mariadb
    container_name: amandine-cuir-database
    restart: unless-stopped
    env_file: .env
    expose:
      - 3306
    environment:
      MYSQL_DATABASE: amandine_cuir
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # See : https://github.com/docker-library/mariadb/issues/160
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    volumes:
      - db-storage:/var/lib/mysql
      - ./database/initdb.d/:/docker-entrypoint-initdb.d/

  amandine-cuir-database-admin:
    image: adminer:4.8.1-standalone
    # https://hub.docker.com/_/adminer
    container_name: amandine-cuir-database-admin
    restart: unless-stopped
    expose:
      - 8080
    depends_on:
      - amandine-cuir-database
    environment:
      VIRTUAL_HOST: adminer.amandine-cuir.com
      LETSENCRYPT_HOST: adminer.amandine-cuir.com
      ADMINER_DESIGN: lucas-sandery
      ADMINER_DEFAULT_SERVER: amandine-cuir-database

volumes:
  wordpress-storage:
  db-storage:

networks:
  default:
    external:
      name: nginx-proxy
