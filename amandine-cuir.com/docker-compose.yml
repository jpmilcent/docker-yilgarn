version: "3"

services:

  amandine-cuir-webserver:
    image: nginx:1.17.4
    container_name: amandine-cuir.com_webserver
    restart: unless-stopped
    ports:
      - 8080:80
    depends_on:
      - amandine-cuir-cms
    environment:
      VIRTUAL_HOST: amandine-cuir.com
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: amandine-cuir.com
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress_data:/var/www/html
      - ./test:/var/www/html/test

  amandine-cuir-cms:
    image: wordpress:5.2.3-php7.3-fpm
    container_name: amandine-cuir.com_cms
    restart: unless-stopped
    env_file: .env
    expose:
      - 9000
    depends_on:
      - amandine-cuir-database
    environment:
      WORDPRESS_DB_HOST: amandine-cuir.com_database:3306
      WORDPRESS_DB_USER: $MYSQL_USER
      WORDPRESS_DB_PASSWORD: $MYSQL_PASSWORD
      WORDPRESS_DB_NAME: amandine_cuir
      WORDPRESS_TABLE_PREFIX: ac_
      #WORDPRESS_AUTH_KEY: -8_8?Mx1WRl+3j#ot&rinIl#O[`+]dSOsel|BG`v$a]FM9$-l]#i:C1|?Y>lt+0m
      #WORDPRESS_SECURE_AUTH_KEY: 8-PC~70[!8Uk*I}G}[9nDwn?B<-Ql|JXWql~3Lbq7/ALS=/Zf8g}Hr^(y6gZ(TL)
      #WORDPRESS_LOGGED_IN_KEY: .dq8j-9%ZJ1Y+#(|o`{|xvN ugXcy=m9#c$M_;LKyd8XbL+g|FonJe^Q<#&/mw9k
      #WORDPRESS_NONCE_KEY: Z<1dpwm<9S2!92-|6-)2 Vp-b!,qH@:iYGfno#T3)rkWz>@cc}|12$`xXzR&vPht
      #WORDPRESS_AUTH_SALT: M|lUSx0uK2G@D0m*dBRX(4~[3K89pB-|U3[$M{vDt%H*F>:zinFqIqn??EfD{3Kv
      #WORDPRESS_SECURE_AUTH_SALT: @xKx-qS##OiN8EwbR:S#ve#hM]H;b~uZqP+,8aYGr5|CU,kvDB56[r|MYGdeD2?l
      #WORDPRESS_LOGGED_IN_SALT: :/G<ZdJ?=P#cI#.@n|C:QgdqYHAs+GgPyc<05f]?-z+iqqsdLn}HCX:)De}]l7yG
      #WORDPRESS_NONCE_SALT: iBwH+}=t]0u?~oB_3$c.D3|S}N,00d.-U@f,yQ~CNL|}&.4xv&I3@$=[bZrhT0h.
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./test:/var/www/html/test


  amandine-cuir-database:
    image: mariadb:10.2.27
    # https://hub.docker.com/_/mariadb
    container_name: amandine-cuir.com_database
    restart: unless-stopped
    env_file: .env
    expose:
      - 3306
    environment:
      MYSQL_DATABASE: amandine_cuir
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      #- ./database/data:/var/lib/mysql
      - ./database/initdb.d/:/docker-entrypoint-initdb.d/

  amandine-cuir-database-admin:
    image: adminer
    # https://hub.docker.com/_/adminer
    container_name: amandine-cuir.com_database-admin
    restart: unless-stopped
    ports:
      - 8082:8080
    environment:
      ADMINER_DESIGN: lucas-sandery
      ADMINER_DEFAULT_SERVER: amandine-cuir.com_database

volumes:
  wordpress_data:
  db_data:

networks:
  default:
    external:
      name: nginx-proxy
