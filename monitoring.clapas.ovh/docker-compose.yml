version: "3"

services:
  monitoring:
    image: portainer/portainer:1.22.1
    container_name: monitoring.clapas.ovh_portainer
    command: -H unix:///var/run/docker.sock
    restart: unless-stopped
    env_file: .env
    ports:
      - 9000:9000
      - 8000:8000
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: 9000
      LETSENCRYPT_HOST: ${DOMAIN}
    command: --admin-password ${ENCRYPTED_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:

networks:
  default:
    external:
      name: ${NETWORK}
