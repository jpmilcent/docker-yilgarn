version: "3"

services:
  influxdb:
    image: influxdb:1.7.8
    container_name: monitor.clapas.ovh_influxdb
    expose:
      - 8086
    env_file:
      - ./influxdb/.env.influxdb
    networks:
      - monitoring
    volumes:
      - influxdb-storage:/var/lib/influxdb/data

  telegraf:
    image: telegraf:1.10.4
    container_name: monitor.clapas.ovh_telegraf
    env_file:
      - ./telegraf/.env.telegraf
    hostname: yilgarn
    depends_on:
      - influxdb
    networks:
      - monitoring
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /etc:/rootfs/etc:ro
      - /proc:/host/proc:ro
      - /sys:/rootfs/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:6.4.3
    container_name: monitor.clapas.ovh_grafana
    expose:
      - 3000
    env_file:
      - ./grafana/.env.grafana
    depends_on:
      - influxdb
    networks:
      - nginx-proxy
      - monitoring
    environment:
      VIRTUAL_HOST: monitor.clapas.ovh
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: monitor.clapas.ovh
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage:
  influxdb-storage:

networks:
  nginx-proxy:
    external: true
  monitoring:
