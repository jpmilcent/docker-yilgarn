services:
  manager-portainer:
    image: portainer/portainer-ce:2.45.3
    # https://hub.docker.com/r/portainer/portainer-ce
    container_name: manager-portainer
    restart: unless-stopped
    env_file: .env
    expose:
      - 9000
      - 8000
    hostname: ${HOSTNAME:-yilgarn}
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: 9000
      LETSENCRYPT_HOST: ${DOMAIN}
    command: -H unix:///var/run/docker.sock --admin-password '${ENCRYPTED_PASSWORD}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-storage:/data

volumes:
  portainer-storage:

networks:
  default:
    name: ${NETWORK:-nginx-proxy}
    external: true
