version: "3"

services:

  memos-clapas-webserver:
    image: nginx:1.18.0
    container_name: memos.clapas.org_webserver
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      - memos-clapas-wiki
    environment:
      VIRTUAL_HOST: memos.clapas.org
      LETSENCRYPT_HOST: memos.clapas.org
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - dokuwiki-storage:/var/www/html
      - data-dokuwiki-storage:/var/www/html/data
      - plugins-dokuwiki-storage:/var/www/html/lib/plugins/
      - conf-dokuwiki-storage:/var/www/html/conf
      - tpl-dokuwiki-storage:/var/www/html/lib/tpl/

  memos-clapas-wiki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memos.clapas.org_dokuwiki
    restart: unless-stopped
    expose:
      - 9000
    volumes:
      - dokuwiki-storage:/var/www/html
      - data-dokuwiki-storage:/var/www/html/data
      - plugins-dokuwiki-storage:/var/www/html/lib/plugins/
      - conf-dokuwiki-storage:/var/www/html/conf
      - tpl-dokuwiki-storage:/var/www/html/lib/tpl/

volumes:
  dokuwiki-storage:
  data-dokuwiki-storage:
  plugins-dokuwiki-storage:
  conf-dokuwiki-storage:
  tpl-dokuwiki-storage:

networks:
  default:
    external:
      name: nginx-proxy
