version: "3"

services:

  genea-clapas-webserver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKUP_DATE: "2019-11-23"
    image: genea:2019-11-23
    container_name: genea.clapas.org_webserver
    restart: unless-stopped
    expose:
      - 80
    environment:
      VIRTUAL_HOST: genea.clapas.org
      LETSENCRYPT_HOST: genea.clapas.org
    volumes:
      - genea-storage:/var/www/html
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/.htpasswd:/var/www/.htpasswd

volumes:
  genea-storage:

networks:
  default:
    external:
      name: nginx-proxy
